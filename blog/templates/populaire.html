<div class="container">
    <div class="row text-center mb-4 mt-3">
        <div class="col-md-12 titre">
            <h4>LES ARTICLES LES PLUS POPULAIRES.</h4>
        </div>
    </div>
    {% if article %}
    <div class="row">
        <div class="col-md-4 mb-4">
            <a href="{% url 'article_detail' article.slug %}" style="text-decoration:none;">
                <article class="card h-100 p-3">
                    <h3>{{ article.title }}</h3><br>
                    <p class="summary">{{ article.summary }}</p><br>
                    <p class="time">📆 Publié il ya {{ article.created_at|timesince }}</p>
                </article>
            </a>
        </div>
    </div>
    {% else %}
    <div class="row">
        <div class="col-md-12 alert lert-info">
            <p>Aucun article disponible.</p>
        </div>
    </div>
    {% endif %}
    <hr>
</div>

<style>
    .titre h4{
        font-size:1rem;
        background-color: black;
        color: white;
        padding: 5px;
        border-radius:10px;
    }
    article:hover{
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
    }
    h4, h3{
        font-family:'Inter';
        font-weight:bolder;
    }
    .time, .summary{
        font-family: 'Inter', sans-serif;
        font-size:13px;
    }
    @media screen and (max-width:425px){
        .titre h4{
            font-size:0.8rem;
        }
    }
</style>
