{% if articles_search %}
    <div class="row mt-4" id="results">
        {% for article in articles_search %}
            <div class="col-md-4 col-sm-6 mb-3">
                <div class="card h-60" data-aos="fade-up" data-aos-duration="2000">
                    <img src="{{ article.img.url }}" alt="{{ article.title }}" class="card-img-top img-fluid">
                    <div class="card-body">
                        <p class="card-text card-date"><i class="fas fa-calendar"></i> {{ article.created_at|date:"d M Y  à  H:i" }}</p>
                        <h4 class="card-title">{{ article.title }}</h4>
                        <p class="card-text card-summary">{{ article.summary }}</p>
                    </div>
                    <hr>
                    <div class="footer-card">
                        <p class="card-text">
                            <img src="{{ article.author.profile.photo.url }}"> 
                            {{ article.author }}
                        </p>
                        <a href="{% url 'article_detail' article.slug %}">
                            <button>Lire l'article</button>
                        </a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% elif query %}
    <div class="alert alert-danger mt-4 p-4">Aucun article trouvé pour "{{ query }}".</div>
{% endif %}
