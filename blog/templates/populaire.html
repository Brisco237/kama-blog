<div class="container">
    <div class="row text-center mb-4 mt-3">
        <div class="col-md-12">
            <h4>LES ARTICLES LES PLUS POPULAIRES.</h4>
        </div>
    </div>
    <div class="row">
        {% for p in populaire %}
            <div class="col-md-4">
                <div class="card p-4">
                    <div class="card-title">{{ p.title }}</div>
                    <div class="card-text">{{ p.summary }}</div>
                </div>
            </div>
        {% endfor %}
    </div>
    <hr>
</div>

<style>
    .card-title,h4{
        font-family:'Playfair Display', serif;
    }
    .card-text{
        font-family: 'Inter', sans-serif;
    }
</style>
