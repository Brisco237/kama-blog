<div class="container">
    <div class="row text-center mb-4 mt-3">
        <div class="col-md-12">
            <h4>LES ARTICLES LES PLUS RECENTS.</h4>
        </div>
    </div>
    <div class="row">
        {% for r in recent_affichage %}
        <div class="col-md-4 mt-3">
            <div class="card p-4">
                <p class="card-title">{{ r.title }}</p>
                <p class="card-text">{{ r.summary }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
    <hr>
</div>

<style>
    .card-title,h4{
        font-family:'Playfair Display', serif;
    }
    .card-text{
        font-family: 'Inter', sans-serif;
    }
</style>
