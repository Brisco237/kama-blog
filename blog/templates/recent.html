<div class="container">
    <div class="row text-center mb-4 mt-3">
        <div class="col-md-12 titre">
            <h4>LES ARTICLES LES PLUS RECENTS.</h4>
        </div>
    </div>
    <div class="row">
        {% for article in articles %}
        <div class="col-md-4 mb-4">
            <a href="{% url 'article_detail' article.slug %}" style="text-decoration:none;">
                <article class="card h-100 p-3">
                    <h3>{{ article.title }}</h3><br>
                    <p>{{ article.summary }}</p><br>
                    <p class="time">Publié il ya {{ article.created_at|timesince }}</p>
                </article>
            </a>
        </div>
        {% empty %}
        <p>Aucun article récent.</p>
        {% endfor %}
    </div>
    <hr>
</div>


<style>
    .time{
        font-family:'Playfair Display';
    }
    .titre h4{
        font-size:1rem;
        background-color: black;
        color: white;
        padding: 5px;
        border-radius:10px;
    }
    .card-title,h4,h3{
        font-family:'Playfair Display', serif;
    }
    article p{
        font-family:'Inter', sans-serif;
        max-height:100%;
    }
    article:hover{
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
    }
    @media screen and (max-width:425px){
        .titre h4{
            font-size:0.8rem;
        }
    }
</style>
